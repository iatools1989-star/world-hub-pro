<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel — iatools.online</title>
<style>
  :root{
    --bg:#fbfbfc; --card:#fff; --ink:#18181b; --muted:#71717a; --line:#e4e4e7;
    --accent:#18181b; --ok:#059669; --warn:#b45309; --bad:#be123c; --focus:#eab308;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:900;letter-spacing:-.02em}
  .brand span{color:var(--muted);font-weight:600;font-size:12px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);
         padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px}
  button:hover{border-color:var(--ink)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.primary:hover{opacity:.88}
  button.danger{color:var(--bad);border-color:#fecdd3}
  button.ghost{border-color:transparent;color:var(--muted);font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  main{max-width:1240px;margin:0 auto;padding:18px 16px 80px;display:grid;grid-template-columns:280px 1fr;gap:18px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px}
  .side{padding:10px}
  .side h3{margin:8px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:10px;
        font-weight:600;font-size:13px;color:var(--ink)}
  .item:hover{background:#f4f4f5}
  .item.on{background:var(--accent);color:#fff}
  .item small{display:block;font-weight:500;font-size:11px;opacity:.66}
  .main-col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .pad{padding:18px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  h2{font-size:14px;margin:0 0 10px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin:0}
  label{display:block;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
        color:var(--muted);margin:14px 0 5px}
  input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
  textarea{resize:vertical;min-height:74px;line-height:1.5}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.row{grid-template-columns:1fr}}
  .count{float:right;font-weight:700;font-size:11px;text-transform:none;letter-spacing:0}
  .count.ok{color:var(--ok)} .count.warn{color:var(--warn)} .count.bad{color:var(--bad)}
  .list-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fcfcfd}
  .list-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .list-head strong{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
  @media(max-width:760px){.grid3{grid-template-columns:1fr}}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{font-size:12px;padding:5px 11px}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .banner{border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
  .banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
  .banner.bad{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
  .banner.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;color:#3f3f46}
  .chk b{font-weight:800}
  .pill{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;
        background:#f4f4f5;color:#52525b;text-transform:uppercase;letter-spacing:.05em}
  .pill.ok{background:#ecfdf5;color:#065f46} .pill.bad{background:#fff1f2;color:#9f1239}
  .file-out{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;white-space:pre;
             overflow:auto;max-height:340px;background:#18181b;color:#e4e4e7;border-radius:12px;padding:12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;
         padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.show{opacity:1}
  .kbd{font-family:ui-monospace,monospace;font-size:11px;background:#f4f4f5;border:1px solid var(--line);
       border-bottom-width:2px;border-radius:5px;padding:1px 5px}
  details summary{cursor:pointer;font-weight:800;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">iatools <span>/ painel</span></div>
    <span class="spacer"></span>
    <span id="statusPill" class="pill">carregando…</span>
    <button id="btnToken" class="ghost">Conectar GitHub</button>
    <button id="btnPublish" class="primary" disabled>Publicar</button>
  </div>
</header>

<main>
  <aside class="card side">
    <h3>Diretório (10)</h3>
    <div id="navDirectory"></div>
    <h3>Ferramentas (16)</h3>
    <div id="navTools"></div>
    <h3>Site</h3>
    <div id="navSite"></div>
  </aside>

  <div class="main-col">
    <div id="editor"></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script src="./bases.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
